<div id="app-root"></div>
<style>
  #app-root, #app-root * { box-sizing: border-box; }
  #app-root {
    --bg-app: #1e1f26;
    --bg-rail: #17181d;
    --bg-list: #21222b;
    --bg-main: #262731;
    --bg-bubble-them: #32333e;
    --bg-bubble-me: #8a6fd8;
    --text-main: #eceef2;
    --text-dim: #9a9bab;
    --accent: #e0678f;
    --accent-soft: #e0678f33;
    --danger: #ff5c7a;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg-app);
    color: var(--text-main);
    width: 100%;
    height: 640px;
    display: flex;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #000;
  }

  /* icon rail */
  .rail {
    width: 64px;
    background: var(--bg-rail);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 10px;
  }
  .rail-dot {
    width: 40px; height: 40px; border-radius: 50%;
    background: #3a3b47;
  }
  .rail-avatar {
    width: 46px; height: 46px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #7d5fd0);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600; cursor: pointer;
    position: relative;
    border: 2px solid transparent;
    transition: border-radius .15s ease;
  }
  .rail-avatar.active { border-radius: 30%; }
  .rail-avatar .ping {
    position: absolute; top: -3px; right: -3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--danger);
    border: 3px solid var(--bg-rail);
  }

  /* dm list */
  .dm-list {
    width: 220px;
    background: var(--bg-list);
    display: flex;
    flex-direction: column;
  }
  .dm-list-header {
    padding: 16px 14px 8px;
    font-size: 11px;
    letter-spacing: .04em;
    color: var(--text-dim);
    border-bottom: 1px solid #00000030;
  }
  .dm-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 8px 0;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
  }
  .dm-item:hover { background: #2c2d38; }
  .dm-item.selected { background: #34354388; }
  .dm-avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #7d5fd0);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .dm-meta { min-width: 0; flex: 1; }
  .dm-name { font-size: 14px; font-weight: 600; }
  .dm-preview {
    font-size: 12px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dm-item.unread .dm-preview { color: var(--text-main); }
  .dm-item.unread .dm-name { color: #fff; }
  .unread-badge {
    background: var(--danger); color: #fff;
    font-size: 10px; font-weight: 700;
    border-radius: 999px; padding: 2px 6px;
    flex-shrink: 0;
  }

  .dm-list-footer {
    margin-top: auto;
    padding: 10px;
    border-top: 1px solid #00000030;
  }
  .log-toggle {
    width: 100%;
    background: none;
    border: 1px solid #3a3b47;
    color: var(--text-dim);
    font-size: 11px;
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
  }
  .log-toggle:hover { color: var(--text-main); border-color: #55566a; }

  /* main pane */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg-main);
  }
  .main-header {
    padding: 14px 18px;
    border-bottom: 1px solid #00000030;
    display: flex; align-items: center; gap: 10px;
    font-weight: 600;
    flex-shrink: 0;
  }
  .main-empty {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 20px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg-row { display: flex; }
  .msg-row.them { justify-content: flex-start; }
  .msg-row.me { justify-content: flex-end; }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
    animation: pop .18s ease;
  }
  .bubble.them {
    background: var(--bg-bubble-them);
    border-bottom-left-radius: 4px;
  }
  .bubble.me {
    background: var(--bg-bubble-me);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .typing {
    display: flex; gap: 4px; align-items: center;
    background: var(--bg-bubble-them);
    padding: 12px 16px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    width: fit-content;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 18px 14px;
    flex-shrink: 0;
  }
  .choice-btn {
    background: #33344066;
    border: 1px solid #4a4b5a;
    color: var(--text-main);
    padding: 9px 14px;
    border-radius: 18px;
    font-size: 13px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .choice-btn:hover {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .composer {
    padding: 14px 18px 18px;
    flex-shrink: 0;
  }
  .composer-box {
    background: #33343f;
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    color: var(--text-dim);
  }

  /* log panel */
  .log-panel {
    position: absolute;
    inset: 0;
    background: #1a1b22ee;
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .log-card {
    background: var(--bg-main);
    border: 1px solid #3a3b47;
    border-radius: 12px;
    width: 340px;
    max-height: 480px;
    display: flex;
    flex-direction: column;
    padding: 18px;
    gap: 10px;
  }
  .log-card h3 { margin: 0 0 2px; font-size: 15px; }
  .log-card .sub { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .log-entries { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .log-entry {
    background: #2c2d38;
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 12.5px;
  }
  .log-entry .q { color: var(--text-dim); margin-bottom: 3px; }
  .log-entry .a { font-weight: 600; }
  .log-empty { color: var(--text-dim); font-size: 12.5px; text-align: center; padding: 20px 0; }
  .log-close {
    align-self: flex-end;
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 12px;
  }
  .log-close:hover { color: var(--text-main); }
  #app-root { position: relative; }
</style>

<script>
(function () {
  const root = document.getElementById('app-root');

  const SCRIPT = [
    {
      key: 'q1',
      question: "Good morning darling",
      choices: ["Good morning", "Good morning sunshine", "Gm"]
    },
    {
      key: 'q2',
      question: "Do you still like me?",
      choices: ["Yes i still do", "No i don't", "Yes i do but i need some space"]
    },
    {
      key: 'interlude',
      question: "I miss us yk? The late night calls, the way you called me baby, bed time stories, your smile and your dumb face, the way you'd keep joking around, the way you'd look at me and say you like me?",
      choices: null // no reply, auto-advances
    },
    {
      key: 'q3',
      question: "Will you give me another chance, allow things to go back to normal?",
      choices: ["I want that too", "I don't think i want that"],
      branch: {
        "I want that too": "I will try my best, i truly will",
        "I don't think i want that": "I understand"
      }
    }
  ];

  let state = {
    opened: false,
    stepIndex: -1,       // which SCRIPT entry we're displaying
    messages: [],         // {from:'them'|'me', text}
    typing: false,
    waitingForChoice: false,
    finished: false,
    logOpen: false,
    savedAnswers: {}
  };

  async function loadSaved() {
    try {
      const res = await window.storage.list('answer:', true);
      const answers = {};
      if (res && res.keys) {
        for (const k of res.keys) {
          try {
            const item = await window.storage.get(k, true);
            if (item) answers[k] = JSON.parse(item.value);
          } catch (e) {}
        }
      }
      state.savedAnswers = answers;
    } catch (e) {
      state.savedAnswers = {};
    }
  }

  async function saveAnswer(key, question, answer) {
    try {
      await window.storage.set('answer:' + key, JSON.stringify({
        question, answer, ts: new Date().toISOString()
      }), true);
    } catch (e) {
      console.error('save failed', e);
    }
  }

  function render() {
    root.innerHTML = `
      <div class="rail">
        <div class="rail-dot"></div>
        <div class="rail-avatar ${state.opened ? 'active' : ''}" id="heart-avatar">
          &lt;3
          ${(!state.opened) ? '<div class="ping"></div>' : ''}
        </div>
      </div>
      <div class="dm-list">
        <div class="dm-list-header">DIRECT MESSAGES</div>
        <div class="dm-item ${state.opened ? 'selected' : ''} ${!state.opened ? 'unread' : ''}" id="dm-item">
          <div class="dm-avatar">&lt;3</div>
          <div class="dm-meta">
            <div class="dm-name">&lt;3</div>
            <div class="dm-preview">${state.opened ? lastPreview() : 'Good morning darling'}</div>
          </div>
          ${(!state.opened) ? '<div class="unread-badge">1</div>' : ''}
        </div>
        <div class="dm-list-footer">
          <button class="log-toggle" id="log-toggle-btn">View saved replies</button>
        </div>
      </div>
      <div class="main">
        ${state.opened ? mainOpenedHTML() : mainEmptyHTML()}
      </div>
      ${state.logOpen ? logPanelHTML() : ''}
    `;

    const avatar = document.getElementById('heart-avatar');
    if (avatar) avatar.onclick = openChat;
    const dmItem = document.getElementById('dm-item');
    if (dmItem) dmItem.onclick = openChat;
    const logBtn = document.getElementById('log-toggle-btn');
    if (logBtn) logBtn.onclick = toggleLog;
    const logClose = document.getElementById('log-close-btn');
    if (logClose) logClose.onclick = toggleLog;

    document.querySelectorAll('.choice-btn').forEach(btn => {
      btn.onclick = () => handleChoice(btn.dataset.choice);
    });

    const msgsEl = document.querySelector('.messages');
    if (msgsEl) msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function lastPreview() {
    if (!state.messages.length) return '...';
    const last = state.messages[state.messages.length - 1];
    return (last.from === 'me' ? 'You: ' : '') + last.text;
  }

  function mainEmptyHTML() {
    return `<div class="main-empty">Select a conversation to start chatting</div>`;
  }

  function mainOpenedHTML() {
    let msgsHTML = state.messages.map(m => `
      <div class="msg-row ${m.from}">
        <div class="bubble ${m.from}">${escapeHTML(m.text)}</div>
      </div>
    `).join('');

    if (state.typing) {
      msgsHTML += `
        <div class="msg-row them">
          <div class="typing"><span></span><span></span><span></span></div>
        </div>
      `;
    }

    let choicesHTML = '';
    if (state.waitingForChoice && !state.typing) {
      const step = SCRIPT[state.stepIndex];
      if (step && step.choices) {
        choicesHTML = `<div class="choices">${step.choices.map(c =>
          `<button class="choice-btn" data-choice="${escapeAttr(c)}">${escapeHTML(c)}</button>`
        ).join('')}</div>`;
      }
    }

    return `
      <div class="main-header">
        <div class="dm-avatar" style="width:28px;height:28px;font-size:12px;">&lt;3</div>
        &lt;3
      </div>
      <div class="messages">${msgsHTML}</div>
      ${choicesHTML}
      <div class="composer">
        <div class="composer-box">${state.finished ? 'Conversation ended' : 'Pick a reply above'}</div>
      </div>
    `;
  }

  function logPanelHTML() {
    const entries = Object.values(state.savedAnswers).sort((a, b) => (a.ts || '').localeCompare(b.ts || ''));
    return `
      <div class="log-panel">
        <div class="log-card">
          <button class="log-close" id="log-close-btn">Close ✕</button>
          <h3>Saved replies</h3>
          <div class="sub">Stored so you can check back later. This is shared storage tied to this link.</div>
          <div class="log-entries">
            ${entries.length ? entries.map(e => `
              <div class="log-entry">
                <div class="q">${escapeHTML(e.question)}</div>
                <div class="a">${escapeHTML(e.answer)}</div>
              </div>
            `).join('') : '<div class="log-empty">No replies yet</div>'}
          </div>
        </div>
      </div>
    `;
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
  function escapeAttr(str) {
    return str.replace(/"/g, '&quot;');
  }

  async function openChat() {
    if (state.opened) return;
    state.opened = true;
    render();
    advanceStep();
  }

  function advanceStep() {
    state.stepIndex++;
    const step = SCRIPT[state.stepIndex];
    if (!step) {
      state.finished = true;
      state.waitingForChoice = false;
      render();
      return;
    }
    state.typing = true;
    state.waitingForChoice = false;
    render();

    setTimeout(() => {
      state.typing = false;
      state.messages.push({ from: 'them', text: step.question });

      if (step.choices) {
        state.waitingForChoice = true;
        render();
      } else {
        render();
        setTimeout(advanceStep, 1100);
      }
    }, 1000 + Math.random() * 500);
  }

  async function handleChoice(choice) {
    const step = SCRIPT[state.stepIndex];
    if (!step) return;

    state.waitingForChoice = false;
    state.messages.push({ from: 'me', text: choice });
    render();

    await saveAnswer(step.key, step.question, choice);
    if (!state.savedAnswers) state.savedAnswers = {};
    state.savedAnswers['answer:' + step.key] = { question: step.question, answer: choice, ts: new Date().toISOString() };

    if (step.branch) {
      setTimeout(() => {
        state.typing = true;
        render();
        setTimeout(() => {
          state.typing = false;
          state.messages.push({ from: 'them', text: step.branch[choice] });
          state.finished = true;
          render();
        }, 1000 + Math.random() * 400);
      }, 600);
      return;
    }

    setTimeout(advanceStep, 900);
  }

  async function toggleLog() {
    if (!state.logOpen) {
      await loadSaved();
    }
    state.logOpen = !state.logOpen;
    render();
  }

  render();
})();
</script>
